<header class="navbar-header">
  <div class="container navbar-container">
    <a href="{{ "/" | relURL }}" class="logo">
      <div class="logo-icon">B</div>
      <span>{{ .Site.Title }}</span>
    </a>
    
    <nav aria-label="Main Navigation">
      <ul class="nav-links" id="nav-links">
        {{ if .Site.Menus.main }}
          {{ range .Site.Menus.main }}
            <li>
              <a href="{{ .URL | relURL }}" class="nav-link{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} active{{ end }}">
                {{ .Name }}
              </a>
            </li>
          {{ end }}
        {{ else }}
          <li><a href="{{ "/" | relURL }}" class="nav-link active">Home</a></li>
          <li><a href="#" class="nav-link">Features</a></li>
          <li><a href="#" class="nav-link">Pricing</a></li>
          <li><a href="#" class="nav-link">About</a></li>
          <li><a href="#" class="nav-link">Contact</a></li>
        {{ end }}
      </ul>
    </nav>

    <div class="navbar-right">

      <div class="nav-actions">
        <a href="#" class="btn btn-secondary" style="padding: 0.55rem 1.1rem; font-size: 0.9rem;">Sign In</a>
        <a href="#" class="btn btn-primary" style="padding: 0.55rem 1.1rem; font-size: 0.9rem;">Get Started</a>
      </div>

      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');
    
    if (toggle && navLinks) {
      toggle.addEventListener('click', () => {
        const isOpen = navLinks.classList.toggle('active');
        toggle.classList.toggle('open');
        toggle.setAttribute('aria-expanded', isOpen);
      });
    }


  });
</script>

<style>
  /* Local Hamburger Toggle Animation */
  .menu-toggle.open span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }
  .menu-toggle.open span:nth-child(2) {
    opacity: 0;
  }
  .menu-toggle.open span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }
</style>
