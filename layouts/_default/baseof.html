<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en-us" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Page Title -->
  <title>
    {{ block "title" . }}
      {{ if .IsHome }}
        {{ .Site.Title }}
      {{ else }}
        {{ .Title }} | {{ .Site.Title }}
      {{ end }}
    {{ end }}
  </title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary }}{{ else }}{{ .Site.Params.Description }}{{ end }}{{ end }}">
  <meta name="author" content="{{ .Site.Params.author.name | default .Site.Title }}">

  <link rel="canonical" href="{{ .Permalink }}">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary }}{{ else }}{{ .Site.Params.Description }}{{ end }}{{ end }}">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="{{ .Permalink }}">
  <meta property="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
  <meta property="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary }}{{ else }}{{ .Site.Params.Description }}{{ end }}{{ end }}">

  <!-- Theme stylesheet using Hugo Resource Pipeline -->
  {{ $style := resources.Get "css/main.css" | minify | fingerprint }}
  {{ if $style }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}" crossorigin="anonymous">
  {{ else }}
    <!-- Fallback if resources.Get fails in standard environment -->
    <link rel="stylesheet" href="{{ "/css/main.css" | relURL }}">
  {{ end }}
</head>
<body>

  <!-- Shared Global Navbar -->
  {{ partial "navbar.html" . }}

  <!-- Main Block Content -->
  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  <!-- Shared Global Footer -->
  {{ partial "footer.html" . }}

</body>
</html>
